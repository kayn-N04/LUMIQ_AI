<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f8f5">
  <title>LUMIQ AI — Thiết kế áo của bạn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="LUMIQ AI trang chủ">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span>LUMIQ<span class="brand-light"> AI</span></span>
    </a>
  </header>

  <main class="page">
    <section class="workspace" aria-label="Khu vực thiết kế áo">
      <div class="editor">
        <div class="section-heading">
          <h2>Tải ảnh lên</h2>
        </div>

        <div class="upload-grid">
          <label class="upload-card" for="shirt-file">
            <input id="shirt-file" type="file" accept="image/png,image/jpeg,image/webp">
            <span class="upload-preview" id="shirt-preview">
              <svg viewBox="0 0 48 48" aria-hidden="true"><path d="m16 8 8 4 8-4 10 7-6 9-5-3v19H17V21l-5 3-6-9 10-7Z"/></svg>
            </span>
            <span class="upload-title">Ảnh áo</span>
            <span class="upload-help" id="shirt-name">Tải ảnh chiếc áo lên</span>
            <span class="upload-action">Chọn ảnh</span>
          </label>
          <label class="upload-card" for="pattern-file">
            <input id="pattern-file" type="file" accept="image/png,image/jpeg,image/webp">
            <span class="upload-preview" id="pattern-preview">
              <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="9" width="34" height="30" rx="4"/><circle cx="18" cy="19" r="3"/><path d="m9 34 10-10 7 7 5-5 8 8"/></svg>
            </span>
            <span class="upload-title">Họa tiết</span>
            <span class="upload-help" id="pattern-name">Tải hình in bạn thích</span>
            <span class="upload-action">Chọn ảnh</span>
          </label>
        </div>

        <div class="form-section color-section">
          <div class="field-heading">
            <h3>Màu áo</h3>
            <span class="selected-color" id="selected-color">Giữ nguyên</span>
          </div>
          <div class="color-options" id="color-options" aria-label="Màu áo"></div>
        </div>

        <details class="placement">
          <summary>Tùy chỉnh vị trí và kích thước</summary>
          <div class="range-grid">
            <label>Vị trí ngang <output id="center-x-value" aria-hidden="true">50%</output>
              <input id="center-x" type="range" min="0" max="100" value="50">
            </label>
            <label>Vị trí dọc <output id="center-y-value" aria-hidden="true">45%</output>
              <input id="center-y" type="range" min="0" max="100" value="45">
            </label>
            <label class="width-range">Độ rộng hình in <output id="print-width-value" aria-hidden="true">25%</output>
              <input id="print-width" type="range" min="1" max="100" value="25">
            </label>
            <label class="width-range">Góc xoay theo chiều kim đồng hồ <output id="rotation-value" aria-hidden="true">0°</output>
              <input id="rotation" type="range" min="-180" max="180" step="1" value="0">
            </label>
          </div>
        </details>

        <button class="generate-button" id="generate-button" type="button">
          <span id="button-label">Tạo thiết kế</span>
        </button>
        <p class="form-note">Xem trước trực tiếp · Ảnh PNG, JPG hoặc WebP · Tối đa 10 MB</p>
        <p class="message" id="message" role="status" aria-live="polite"></p>
      </div>

      <aside class="result-panel">
        <div class="result-heading">
          <h2 id="preview-title">Xem trước</h2>
        </div>
        <div class="result-canvas">
          <div class="empty-state" id="empty-state">
            <div class="empty-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48"><path d="m16 8 8 4 8-4 10 7-6 9-5-3v19H17V21l-5 3-6-9 10-7Z"/></svg>
            </div>
            <p>Tải ảnh áo để xem vị trí in</p>
          </div>
          <div class="mockup-preview" id="mockup-preview" hidden>
            <div class="mockup-stage" id="mockup-stage">
              <img id="mockup-shirt" alt="Ảnh áo xem trước">
              <img id="mockup-pattern" alt="" hidden>
            </div>
          </div>
          <img class="result-image" id="result-image" alt="Ảnh áo sau khi được AI thiết kế" hidden>
          <div class="loading-state" id="loading-state" hidden>
            <span class="loader"></span>
            <strong>Đang tạo thiết kế...</strong>
          </div>
        </div>
        <a class="download-link" id="download-link" href="#" download hidden>
          Tải ảnh thiết kế <span aria-hidden="true">↓</span>
        </a>
      </aside>
    </section>

    <footer class="footer">
      <span>© LUMIQ AI</span>
    </footer>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
